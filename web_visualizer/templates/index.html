<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catan PPO Agent Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 320px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .game-info {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .game-info h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .player-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid;
        }

        .player-card.BLUE { border-left-color: #2196F3; }
        .player-card.RED { border-left-color: #f44336; }
        .player-card.ORANGE { border-left-color: #ff9800; }
        .player-card.WHITE { border-left-color: #9e9e9e; }

        .player-name {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .player-stats {
            font-size: 14px;
            color: #555;
        }

        .resources {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .resource-chip {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            background: rgba(255,255,255,0.7);
            font-weight: 600;
        }

        .resource-chip.WOOD { background-color: #8d6e63; color: white; }
        .resource-chip.BRICK { background-color: #d84315; color: white; }
        .resource-chip.SHEEP { background-color: #81c784; color: white; }
        .resource-chip.WHEAT { background-color: #ffd54f; color: #333; }
        .resource-chip.ORE { background-color: #616161; color: white; }

        #canvas-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #game-canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.connected {
            background-color: #4caf50;
            animation: pulse 2s infinite;
        }

        .status-indicator.disconnected {
            background-color: #f44336;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .action-log {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
        }

        .action-log .log-entry {
            padding: 5px;
            border-bottom: 1px solid #eee;
        }

        .winner-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.98);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 1000;
            display: none;
        }

        .winner-banner.show {
            display: block;
            animation: bounceIn 0.5s;
        }

        @keyframes bounceIn {
            0% { transform: translate(-50%, -50%) scale(0); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .winner-banner h2 {
            color: #667eea;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .legend {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 11px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="game-info">
                <h3>
                    <span class="status-indicator disconnected" id="connection-status"></span>
                    Connection Status
                </h3>
                <p id="status-text">Connecting...</p>
            </div>

            <div class="game-info">
                <h3>Game Info</h3>
                <p><strong>Episode:</strong> <span id="episode">-</span></p>
                <p><strong>Step:</strong> <span id="step">-</span></p>
                <p><strong>Current Turn:</strong> <span id="current-player">-</span></p>
            </div>

            <div class="game-info">
                <h3>Players</h3>
                <div id="players-container"></div>
            </div>

            <div class="action-log">
                <strong>Recent Actions:</strong>
                <div id="action-log-entries"></div>
            </div>

            <div class="legend">
                <strong>Legend:</strong>
                <div class="legend-item">
                    <div class="legend-color" style="background: #8d6e63;"></div>
                    <span>Wood (Forest)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #d84315;"></div>
                    <span>Brick (Hills)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #81c784;"></div>
                    <span>Sheep (Pasture)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ffd54f;"></div>
                    <span>Wheat (Fields)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #616161;"></div>
                    <span>Ore (Mountains)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #f4e4c1;"></div>
                    <span>Desert</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <h1>🎲 Catan PPO Agent Real-Time Visualizer</h1>
            <div id="canvas-container">
                <canvas id="game-canvas"></canvas>
                <div class="winner-banner" id="winner-banner">
                    <h2>🎉 Game Over! 🎉</h2>
                    <p style="font-size: 24px; margin-top: 15px;">Winner: <strong id="winner-name">-</strong></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='visualizer.js') }}"></script>
</body>
</html>
